name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    name: Build / Vet / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        # 独立、阻塞式的 staticcheck 步骤（与 golangci-lint 互补并互不影响）。
        # 当前与 golangci-lint 保持一致，先以非阻塞方式引入暴露存量问题，
        # 待团队清理后可将 continue-on-error 移除升级为阻塞。
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2024.1.1"
          install-go: false
        continue-on-error: true

      - name: Lint (golangci-lint)
        # 静态检查作为非阻塞步骤引入：先暴露存量问题，待团队清理后再移除 continue-on-error
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
        continue-on-error: true

      - name: Test (with race detector)
        run: go test ./... -race -count=1
