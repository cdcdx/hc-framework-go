apiVersion: v1
kind: Secret
metadata:
  name: hc-framework-secret
  namespace: default
type: Opaque
stringData:
  # 生产环境实际部署前必须替换
  APP_AUTH_JWT_SIGNING_KEY: "change-me-in-production"
  APP_AUTH_JWT_PRIVATE_KEY_PATH: "/etc/secrets/jwt-private.pem"
  APP_AUTH_JWT_PUBLIC_KEY_PATH: "/etc/secrets/jwt-public.pem"

  # 数据库密码
  MYSQL_PASSWORD: "change-me-in-production"
  POSTGRES_PASSWORD: "change-me-in-production"
  APP_DATABASE_USER_MONGODB_DSN: "mongodb://admin:change-me-in-production@mongodb:27017/hc_users?authSource=admin"
  APP_DATABASE_LOG_ELASTICSEARCH_ADDRESSES: '["http://elastic:change-me-in-production@elasticsearch:9200"]'
  APP_DATABASE_MONITOR_CLICKHOUSE_DSN: "clickhouse://admin:change-me-in-production@clickhouse:19000/hc_monitor"

  # Redis 密码
  APP_CACHE_L2_PASSWORD: "change-me-in-production"

  # OAuth2
  APP_OAUTH_GOOGLE_CLIENT_ID: "change-me-in-production"
  APP_OAUTH_GOOGLE_CLIENT_SECRET: "change-me-in-production"

  # 验证码
  APP_CAPTCHA_TENCENT_APP_ID: "change-me-in-production"
  APP_CAPTCHA_TENCENT_SECRET_KEY: "change-me-in-production"
  APP_CAPTCHA_TURNSTILE_SITE_KEY: "change-me-in-production"
  APP_CAPTCHA_TURNSTILE_SECRET_KEY: "change-me-in-production"
  APP_CAPTCHA_RECAPTCHA_SITE_KEY: "change-me-in-production"
  APP_CAPTCHA_RECAPTCHA_SECRET_KEY: "change-me-in-production"
  APP_CAPTCHA_HCAPTCHA_SITE_KEY: "change-me-in-production"
  APP_CAPTCHA_HCAPTCHA_SECRET_KEY: "change-me-in-production"

  # Kafka SASL
  APP_MQ_KAFKA_SASL_USERNAME: "change-me-in-production"
  APP_MQ_KAFKA_SASL_PASSWORD: "change-me-in-production"

  # 运营管理令牌（抢购活动创建/预热/对账接口鉴权，对应 config.admin.token）
  # 部署时务必改为强随机值；k6 压测需以 ADMIN_TOKEN 传入同一串。
  APP_ADMIN_TOKEN: "change-me-in-production"
