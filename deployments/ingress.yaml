# ============================================================
# K8s Ingress（nginx-ingress）接入清单
# ------------------------------------------------------------
# 与 deployments/nginx.conf 二选一：
#   - 已有独立 Nginx/硬件 L4 → 用 nginx.conf；
#   - 纯 K8s 环境 → 用本 Ingress（由 ingress-nginx Controller 承载 TLS/限流）。
# 心跳限流豁免在应用层（config exempt_paths）已做，Ingress 层做全局防护即可。
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hc-framework-ingress
  namespace: default
  annotations:
    # 由 ingress-nginx 提供 TLS 与限流
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
    # 全局限流（rps）：百万规模下作为“外层闸门”，内层仍由应用 ratelimit 兜底
    nginx.ingress.kubernetes.io/limit-rps: "5000"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    # 心跳路径在应用层豁免；若需在 Ingress 层也豁免，可用 server-snippet（见下）
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /api/v1/idle/heartbeat {
          proxy_pass http://hc-framework.default.svc.cluster.local:80;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
spec:
  tls:
    - hosts:
        - api.hc-framework.local        # 生产替换为真实域名
      secretName: hc-tls-secret          # 由 cert-manager 生成
  rules:
    - host: api.hc-framework.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hc-framework
                port:
                  number: 80
