# deployments/prometheus/prometheus.yaml
#
# Prometheus 配置：抓取 go-zero 版 hc-framework-go 服务的 /metrics，
# 载入告警规则，并把告警发给 Alertmanager。
#
# 配套文件：
#   - rules/flash.yaml          （10309 超时容量告警规则）
#   - rules/app.yaml            （全栈告警规则）
#   - alertmanager.yaml         （Alertmanager 路由/接收方）
#
# 部署提示（k8s 示例）：
#   scrape_configs 中的 targets 用 Service 名替换；
#   用 ConfigMap 挂载本文件 + rules/ 目录。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # 合并部署的单进程 hc-server：REST(:8080) 与 Prometheus 指标(:8080/metrics) 共用同一端口，
  # 统一在此处 scrape。网关与后端指标共享同一 prometheus 注册表，由 service label 区分。
  - job_name: "hc-server"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          env: "stress"
          service: "hc-server"
