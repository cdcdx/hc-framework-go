# HorizontalPodAutoscaler：配合 deployments/statefulset.yaml（StatefulSet）+ 扫描分片 + Headless 动态发现，
# 实现离线检测扫描的自动扩缩。
# 关键约束：
#   - scaleTargetRef 必须指向 StatefulSet（而非 deployment.yaml 的 Deployment）。扫描分片（Pod Sharding）依赖
#     StatefulSet 提供的稳定序号（POD_NAME ordinal 作 pod_index）与 Headless Service DNS 动态发现 pod_total；
#     deployment.yaml 未注入 HC_POD_INDEX、无稳定序号，无法分摊扫描，对其启用 scan_sharding 会重复扫描同一分片。
#   - 副本数变化由各 Pod 经 DNS 自动感知（configmap 中 pod_discovery=headless），无需手改 HC_POD_TOTAL。
#   - 缩容时，被删 Pod 的分片由“死分片接管（failover）”兜底，缩容瞬间短暂分片缺口会自愈。
# 注意：本 HPA 直接扩缩 StatefulSet，因此 statefulset.yaml 中的 replicas 仅作初始值，运行期由 HPA 接管。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hc-framework-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: hc-framework
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "2000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
