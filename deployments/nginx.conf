# ============================================================
# Nginx 接入层配置（前置限流 + TLS 卸载 + 连接打散）
# ------------------------------------------------------------
# 适用：Nginx 以 DaemonSet / 独立 Deployment 跑在 K8s 边缘节点，
#       通过集群 DNS 解析 upstream（hc-framework:80）。
# 说明：
#   - 心跳是“在线判活命脉”，与 config.yaml 的 exempt_paths 对齐，Nginx 层也豁免限流；
#   - 其它接口走全局 limit_req（令牌桶），与 ratelimit.global 形成“双层限流”。
# ============================================================

# 共享内存区：全局限流桶（10MB 约 16万 IP 状态）
limit_req_zone $binary_remote_addr zone=hc_global:10m rate=5000r/s;

worker_processes  auto;
events {
    worker_connections  65535;     # 百万长连接：单 worker 连接数调高
    multi_accept        on;
    use                 epoll;
}

http {
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;         # 设备 keepalive 长连接
    client_max_body_size 4m;       # 与 logging.request_body_max_size 对齐

    upstream hc_backend {
        # K8s Service DNS，由 kube-proxy/ClusterIP 做 Pod 负载均衡
        server hc-framework:80 max_fails=3 fail_timeout=10s;
        keepalive 256;             # 连接池复用，减少握手
    }

    # ---------- HTTPS 接入 ----------
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS：证书由 cert-manager 注入（生产），此处为示例路径
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全响应头
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;

        # 心跳：豁免限流（与 config 中 exempt_paths 对齐），避免 429 误判离线
        location = /api/v1/idle/heartbeat {
            proxy_pass http://hc_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 其它接口：全局限流（双层防护，应用层仍有 ratelimit）
        location / {
            limit_req zone=hc_global burst=2000 nodelay;
            proxy_pass http://hc_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTP 80 统一重定向到 443
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
