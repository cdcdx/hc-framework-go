# PostgreSQL 压测服务端调优（idle_settle 500 VU 必备）
# 与 deployments/mysql-stress.cnf 对齐，供 PostgreSQL 版压测（make pg-stress-tune）使用。
#
# ⚠️ max_connections 是【重启参数】，仅改配置文件/ALTER SYSTEM 而不重启不生效。
# ⚠️ 不要盲目设 shared_buffers=1GB：若容器/主机可用内存不足，PG 重启后会起不来。
#    本目标默认只改 max_connections + 几个写入侧放松项，避免把实例调挂。
#
# 用法（任选其一）：
#
# ① 运行时即时（make pg-stress-tune 已自动执行，但 max_connections 仍需重启）：
#      ALTER SYSTEM SET max_connections=800;
#      ALTER SYSTEM SET synchronous_commit=off;
#      ALTER SYSTEM SET wal_writer_delay='200ms';
#      ALTER SYSTEM SET checkpoint_timeout='10min';
#      然后重启 PG 实例（ALTER SYSTEM 写入 postgresql.auto.conf，重启后生效）。
#
# ② 启动时直接注入（推荐，免重启；docker postgres 镜像支持用 -c 追加 GUC 参数）：
#      docker run -d --name postgresql -p 5432:5432 \
#        -e POSTGRES_PASSWORD=123456 -e POSTGRES_USER=demo -e POSTGRES_DB=hc_business \
#        postgres -c max_connections=800 -c synchronous_commit=off \
#        -c wal_writer_delay=200ms -c checkpoint_timeout=10min
#      （注意：命令行 -c 优先级高于 postgresql.auto.conf，若之后再用 ALTER SYSTEM 改，需重建容器。）
#
# ③ 或挂载本文件到 /etc/postgresql/postgresql.conf.d/ 并重启容器/服务。

max_connections            = 800          # 重启参数：须重启；等价于 ALTER SYSTEM SET max_connections=800;
synchronous_commit        = off          # 压测放宽持久化（丢最后一次提交风险），生产勿用
wal_writer_delay          = 200ms
checkpoint_timeout        = 10min
# shared_buffers          = 1GB          # 谨慎：需容器/主机内存 ≥ ~1.5GB，否则 PG 重启失败；默认不调。
