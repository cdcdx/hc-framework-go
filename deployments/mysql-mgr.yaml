# ============================================================
# MySQL · InnoDB Cluster / Group Replication（单主，1 主 2 从）
# ------------------------------------------------------------
# 对应 8.4.2 / 8.3：MGR 单主，read_write_split 已开；跨机反亲和。
# 说明：
#   - 组内首个节点（mysql-0）需先 bootstrap_group，其余节点 join；
#   - 下方启动脚本自动判定：仅 mysql-0 且在未初始化时执行 bootstrap。
#   - 业务库用 hc_business；应用 DSN 指向 mysql-master（读写）与从库（读）。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: mysql
              topologyKey: kubernetes.io/hostname
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hc-framework-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              value: "hc_business"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              # 启动前根据 ordinal 决定 bootstrap / join（简化版 MGR 引导）
              export ORD=${HOSTNAME##*-}
              docker-entrypoint.sh mysqld &
              # 等待就绪后配置组复制（生产建议用 mysql-shell / init 容器完成）
              until mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"; do sleep 3; done
              if [ "$ORD" = "0" ]; then
                mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SET GLOBAL group_replication_bootstrap_group=ON; START GROUP_REPLICATION; SET GLOBAL group_replication_bootstrap_group=OFF;"
              else
                mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "START GROUP_REPLICATION;"
              fi
              wait
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nvme-sc
        resources:
          requests:
            storage: 100Gi
