apiVersion: v1
kind: ConfigMap
metadata:
  name: hc-framework-config
  namespace: default
data:
  APP_SERVER_PORT: "8080"
  APP_SERVER_MODE: "release"
  APP_SERVER_READ_TIMEOUT: "30s"
  APP_SERVER_WRITE_TIMEOUT: "30s"
  APP_SERVER_SHUTDOWN_TIMEOUT: "30s"

  # 缓存
  APP_CACHE_L1_ENABLED: "true"
  APP_CACHE_L1_MAX_MEMORY_MB: "256"
  APP_CACHE_L1_DEFAULT_TTL: "5m"
  APP_CACHE_L2_ENABLED: "true"
  APP_CACHE_L2_TYPE: "redis"
  APP_CACHE_L2_ADDRESSES: "redis-cluster:6379"
  APP_CACHE_HOTKEY_ENABLED: "true"
  APP_CACHE_HOTKEY_WINDOW_SECONDS: "10"
  APP_CACHE_HOTKEY_TOP_N: "100"
  APP_CACHE_TTL_JITTER: "0.2"
  APP_CACHE_BLOOM_ENABLED: "true"
  APP_CACHE_NULL_CACHE_TTL: "60s"
  APP_CACHE_DOUBLE_DELETE_DELAY: "500ms"

  # 数据库
  APP_DATABASE_BUSINESS_DRIVER: "mysql"
  APP_DATABASE_BUSINESS_MYSQL_MASTER: "mysql://root:$(MYSQL_PASSWORD)@mysql-master:3306/hc_business?charset=utf8mb4&parseTime=True"
  APP_DATABASE_BUSINESS_MYSQL_MAX_IDLE_CONNS: "25"
  APP_DATABASE_BUSINESS_MYSQL_MAX_OPEN_CONNS: "200"
  APP_DATABASE_BUSINESS_MYSQL_CONN_MAX_LIFETIME: "1h"
  APP_DATABASE_USER_DRIVER: "mongodb"
  APP_DATABASE_LOG_DRIVER: "elasticsearch"
  APP_DATABASE_MONITOR_DRIVER: "clickhouse"
  APP_DATABASE_FALLBACK_ENABLED: "true"
  APP_DATABASE_READ_WRITE_SPLIT_ENABLED: "true"

  # MQ
  APP_MQ_TYPE: "kafka"
  APP_MQ_KAFKA_BROKERS: "kafka-broker-0:9092,kafka-broker-1:9092,kafka-broker-2:9092"
  APP_MQ_KAFKA_CONSUMER_GROUP_ID: "hc-consumer-group"
  APP_MQ_KAFKA_CONSUMER_WORKER_POOL_SIZE: "8"
  APP_MQ_KAFKA_CONSUMER_RETRY_MAX: "5"

  # 限流
  APP_RATELIMIT_ENABLED: "true"
  APP_RATELIMIT_GLOBAL_RATE: "5000"
  APP_RATELIMIT_GLOBAL_BURST: "1000"
  # 限流白名单（IP / UserID）；同时豁免安全限流（security.ip_limit，见 internal/middleware/security.go）。
  # 压测环境可放行 localhost：放开下方注释即可；生产环境请保持注释状态，以免削弱防爆破防护。
  # APP_RATELIMIT_WHITELIST: "127.0.0.1"

  # 熔断
  APP_CIRCUIT_BREAKER_ENABLED: "true"
  APP_CIRCUIT_BREAKER_FAILURE_THRESHOLD: "0.5"
  APP_CIRCUIT_BREAKER_OPEN_DURATION: "30s"

  # 日志
  APP_LOGGING_LEVEL: "info"
  APP_LOGGING_FORMAT: "json"
  APP_LOGGING_OUTPUT: "stdout"

  # 链路追踪
  APP_TRACING_ENABLED: "true"
  APP_TRACING_OTLP_ENDPOINT: "jaeger-collector:4317"
  APP_TRACING_SAMPLER_RATE: "0.1"

  # 认证
  APP_AUTH_JWT_ALGORITHM: "RS256"
  APP_AUTH_JWT_ACCESS_TTL: "2h"
  APP_AUTH_JWT_REFRESH_TTL: "168h"
  APP_AUTH_PASSWORD_BCRYPT_COST: "12"

  # 验证码
  APP_CAPTCHA_TYPE: "tencent"

  # 业务
  APP_IDLE_HEARTBEAT_INTERVAL: "30s"
  APP_IDLE_TIMEOUT_THRESHOLD: "90s"
  APP_IDLE_POINTS_PER_MINUTE: "10"
  APP_IDLE_DAILY_POINTS_LIMIT: "14400"
  APP_TASK_DAILY_RESET_HOUR: "0"
  APP_TASK_WEEKLY_RESET_DAY: "monday"

  # 离线检测扫描分片（配合 deployments/statefulset.yaml 注入的 HC_POD_INDEX，及 Headless Service 动态发现 pod_total）：
  # 开启后每个 Pod 仅扫描/消费属于自己的活跃集合分片，消除“每副本全量扫描”冗余。
  # 单/双实例部署保持 false（全量扫描）。
  APP_IDLE_SCAN_SHARDING_ENABLED: "true"
  # 分片发现方式：env=静态（pod_index/total 来自 HC_POD_INDEX/HC_POD_TOTAL，需随 replicas 同步）；
  #               headless=经 Headless Service DNS A 记录动态感知就绪副本数（推荐用于 HPA 自动扩缩）。
  APP_IDLE_SCAN_SHARDING_POD_DISCOVERY: "headless"
  # Headless Service 名（pod_discovery=headless 时必填），须与 statefulset.yaml 末尾 Headless Service 同名。
  APP_IDLE_SCAN_SHARDING_HEADLESS_SERVICE: "hc-framework-headless"
  # 死分片接管（依赖上方选主）：Leader 接管宕机/缩容 Pod 的分片，消除可用性缺口。
  APP_IDLE_SCAN_SHARDING_FAILOVER: "true"
  # 选主（多副本单例任务协调）：仅 Leader 执行每日/每周任务重置、事件去重清理等“恰好一次”任务。
  # L2(Redis) 不可用时自动降级为每 Pod 各自执行（乐观锁兜底）。扫描分片模式下各 Pod 扫描自身分片，不依赖选主。
  APP_IDLE_LEADER_ELECTION_ENABLED: "true"

  # K8s 探针
  APP_HEALTH_ENABLED: "true"
