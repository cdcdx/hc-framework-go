syntax = "proto3";

package task;

option go_package = "github.com/cdcdx/hc-framework-go/app/task/rpc/task";

// 任务服务
service Task {
  rpc List(ListRequest) returns (ListResponse);
  rpc Progress(ProgressRequest) returns (ProgressResponse);
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse);
}

message TaskInfo {
  int64 id = 1;
  string task_type = 2;
  string task_key = 3;
  string task_name = 4;
  int32 target_value = 5;
  int64 reward_points = 6;
  bool is_active = 7;
  string period = 8;
  int32 current_progress = 9;
  bool is_completed = 10;
  bool is_claimed = 11;
}

message ListRequest {
  string user_id = 1;
}

message ListResponse {
  repeated TaskInfo tasks = 1;
}

message ProgressRequest {
  string user_id = 1;
}

message ProgressResponse {
  repeated TaskInfo tasks = 1;
}

message ClaimRequest {
  string user_id = 1;
  int64 task_id = 2;
}

message ClaimResponse {
  TaskInfo task = 1;
  int64 reward_points = 2;
}

message ReportProgressRequest {
  string user_id = 1;
  string task_key = 2;
  int32 delta = 3;
}

message ReportProgressResponse {
  TaskInfo task = 1;
  bool completed = 2;
}
