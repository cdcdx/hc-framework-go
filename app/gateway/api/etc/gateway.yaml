Name: gateway-api
Host: 0.0.0.0
Port: 8080

# JWT 校验配置（与 user-rpc 签发共用同一套密钥/算法/issuer）
Auth:
  Jwt:
    Algorithm: HS256
    SigningKey: change-me-in-prod
    Issuer: hc-framework
    AccessTTL: 1h
    RefreshTTL: 720h

# 验证码防水墙（false 时跳过校验；provider 支持 turnstile/recaptcha/hcaptcha/tencent）
Captcha:
  Enabled: false
  Provider: turnstile
  SiteKey: ""
  SecretKey: ""
  AppID: ""

# IP 限频（进程内窗口，单实例有效；多实例部署请接入 Redis 版限流）
Security:
  IPLimitEnabled: false
  IPLimitPerMinute: 30

# 依赖单一领域 rpc
HcRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: hc.rpc

Prometheus:
  Host: 0.0.0.0
  Port: 9100
