syntax = "proto3";

package user;

option go_package = "github.com/cdcdx/hc-framework-go/app/user/rpc/user";

// 用户服务
service User {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GoogleOAuth(GoogleOAuthRequest) returns (GoogleOAuthResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetPoints(GetPointsRequest) returns (GetPointsResponse);
  rpc AddPoints(AddPointsRequest) returns (AddPointsResponse);
  rpc DeductPoints(DeductPointsRequest) returns (DeductPointsResponse);
}

message UserInfo {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string avatar_url = 4;
  int64 points_balance = 5;
  string status = 6;
  int64 created_at = 7;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message GoogleOAuthRequest {
  string code = 1;
}

message GoogleOAuthResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message ChangePasswordRequest {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  UserInfo user = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  string username = 2;
  string avatar_url = 3;
}

message UpdateProfileResponse {
  UserInfo user = 1;
}

message GetPointsRequest {
  string user_id = 1;
}

message GetPointsResponse {
  string user_id = 1;
  int64 points_balance = 2;
}

message AddPointsRequest {
  string user_id = 1;
  int64 points = 2;
  string reason = 3;
}

message AddPointsResponse {
  string user_id = 1;
  int64 points_balance = 2;
}

message DeductPointsRequest {
  string user_id = 1;
  int64 points = 2;
  string reason = 3;
}

message DeductPointsResponse {
  string user_id = 1;
  int64 points_balance = 2;
}
