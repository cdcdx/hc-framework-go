syntax = "proto3";

package user;

option go_package = "./user";

// User 用户领域服务：认证（注册/登录/刷新/改密）+ 用户信息 + 积分账户。
// 积分增减对外暴露 rpc（AddPoints/DeductPoints），供 idle-rpc / task-rpc / shop-rpc 结算时调用。
service User {
  // 邮箱注册，成功直接签发 token 对
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 邮箱密码登录
  rpc Login(LoginRequest) returns (LoginResponse);
  // Google OAuth 登录/注册
  rpc GoogleOAuth(GoogleOAuthRequest) returns (LoginResponse);
  // 刷新 token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // 修改密码（校验旧密码，并使已签发 token 失效）
  rpc ChangePassword(ChangePasswordRequest) returns (Empty);
  // 用户资料
  rpc GetProfile(GetProfileRequest) returns (UserInfo);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserInfo);
  // 积分余额
  rpc GetPoints(GetPointsRequest) returns (GetPointsResponse);
  // 加分（挂机/任务奖励入账；负值校验在服务端）
  rpc AddPoints(AddPointsRequest) returns (AddPointsResponse);
  // 扣分（兑换扣款，余额不足报错）
  rpc DeductPoints(DeductPointsRequest) returns (DeductPointsResponse);
}

message Empty {}

message UserInfo {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string avatar_url = 4;
  int64 points_balance = 5;
  string status = 6;
  int64 created_at = 7; // unix 秒
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3; // 可选
}

message RegisterResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message GoogleOAuthRequest {
  string code = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message ChangePasswordRequest {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message GetProfileRequest {
  string user_id = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  string username = 2;   // 可选，<=50
  string avatar_url = 3; // 可选，<=500
}

message GetPointsRequest {
  string user_id = 1;
}

message GetPointsResponse {
  string user_id = 1;
  int64 points_balance = 2;
}

message AddPointsRequest {
  string user_id = 1;
  int64 points = 2;   // >0 加分
  string reason = 3;
}

message AddPointsResponse {
  int64 points_balance = 1;
}

message DeductPointsRequest {
  string user_id = 1;
  int64 points = 2; // >0 扣分
  string reason = 3;
}

message DeductPointsResponse {
  int64 points_balance = 1;
}
