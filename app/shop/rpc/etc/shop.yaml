Name: shop.rpc
ListenOn: 0.0.0.0:8004
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: shop.rpc

DB:
  Driver: sqlite
  Dsn: data/shop.db

# 依赖 user-rpc（扣积分）与 task-rpc（上报兑换进度）
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc

TaskRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: task.rpc

Prometheus:
  Host: 0.0.0.0
  Port: 9104
