syntax = "proto3";

package shop;

option go_package = "github.com/cdcdx/hc-framework-go/app/shop/rpc/shop";

// 商城服务
service Shop {
  rpc Items(ItemsRequest) returns (ItemsResponse);
  rpc Redeem(RedeemRequest) returns (RedeemResponse);
  rpc Orders(OrdersRequest) returns (OrdersResponse);
  rpc OrderDetail(OrderDetailRequest) returns (OrderDetailResponse);
  rpc FlashActivities(FlashActivitiesRequest) returns (FlashActivitiesResponse);
  rpc FlashRedeem(FlashRedeemRequest) returns (FlashRedeemResponse);
}

message ItemInfo {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 price_points = 4;
  int32 stock = 5;
  string image_url = 6;
  string category = 7;
  bool is_active = 8;
  string sales_status = 9;
}

message ItemsRequest {
  int64 cursor = 1;
  int32 limit = 2;
  string category = 3;
}

message ItemsResponse {
  repeated ItemInfo items = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
}

message RedeemRequest {
  string user_id = 1;
  int64 item_id = 2;
  int32 quantity = 3;
}

message RedeemResponse {
  OrderInfo order = 1;
}

message OrderInfo {
  int64 id = 1;
  string user_id = 2;
  int64 item_id = 3;
  string item_name = 4;
  int64 points_spent = 5;
  string order_status = 6;
  int64 activity_id = 7;
  int64 created_at = 8;
}

message OrdersRequest {
  string user_id = 1;
  string status = 2;
  int64 cursor = 3;
  int32 limit = 4;
}

message OrdersResponse {
  repeated OrderInfo orders = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
}

message OrderDetailRequest {
  string user_id = 1;
  int64 order_id = 2;
}

message OrderDetailResponse {
  OrderInfo order = 1;
}

message FlashActivityInfo {
  int64 id = 1;
  int64 item_id = 2;
  string name = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  int32 limit_qty = 6;
  int32 sold_qty = 7;
  int32 per_user_limit = 8;
  int64 price_points = 9;
  string status = 10;
  string sales_status = 11;
}

message FlashActivitiesRequest {
  int32 limit = 1;
}

message FlashActivitiesResponse {
  repeated FlashActivityInfo activities = 1;
}

message FlashRedeemRequest {
  string user_id = 1;
  int64 activity_id = 2;
  int32 quantity = 3;
}

message FlashRedeemResponse {
  OrderInfo order = 1;
}
