Name: idle.rpc
ListenOn: 0.0.0.0:8002
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: idle.rpc

DB:
  Driver: sqlite
  Dsn: data/idle.db

# 挂机业务参数
Idle:
  MaxActiveDevices: 3
  PointsPerMinute: 1
  DailyPointsLimit: 240

# 依赖 user-rpc（积分入账）
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc

Prometheus:
  Host: 0.0.0.0
  Port: 9102
