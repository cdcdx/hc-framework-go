syntax = "proto3";

package idle;

option go_package = "github.com/cdcdx/hc-framework-go/app/idle/rpc/idle";

// 挂机服务
service Idle {
  rpc Start(StartRequest) returns (IdleRecord);
  rpc Heartbeat(HeartbeatRequest) returns (Empty);
  rpc Stop(StopRequest) returns (IdleRecord);
  rpc StopDevice(StopDeviceRequest) returns (IdleRecord);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Records(RecordsRequest) returns (RecordsResponse);
}

message Empty {}

message IdleRecord {
  int64 id = 1;
  string user_id = 2;
  string device_id = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  int32 duration_seconds = 6;
  int64 points_earned = 7;
  string status = 8;
  int64 last_heartbeat_at = 9;
}

message StartRequest {
  string user_id = 1;
  string device_id = 2;
}

message HeartbeatRequest {
  string user_id = 1;
  string device_id = 2;
}

message StopRequest {
  string user_id = 1;
}

message StopDeviceRequest {
  string user_id = 1;
  string device_id = 2;
}

message StatusRequest {
  string user_id = 1;
}

message StatusResponse {
  repeated IdleRecord records = 1;
  int64 today_points = 2;
}

message RecordsRequest {
  string user_id = 1;
  int64 cursor = 2;
  int32 limit = 3;
}

message RecordsResponse {
  repeated IdleRecord records = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
}
